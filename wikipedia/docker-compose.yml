services:
  wikipedia-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: c2mem-wikipedia:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${WIKI_SERVICE_PORT:-8000}:${WIKI_SERVICE_PORT:-8000}"
    environment:
      WIKI_SERVICE_HOST: 0.0.0.0
      WIKI_SERVICE_PORT: ${WIKI_SERVICE_PORT:-8000}
      WIKI_SERVICE_CHROMA_DIR: /app/data/chroma
      WIKI_SERVICE_COLLECTION: ${WIKI_SERVICE_COLLECTION:-wiki_abstracts}
      WIKI_SERVICE_DEFAULT_TOP_K: ${WIKI_SERVICE_DEFAULT_TOP_K:-10}
      WIKI_SERVICE_TIMEOUT_SECONDS: ${WIKI_SERVICE_TIMEOUT_SECONDS:-60}
      WIKI_SERVICE_WARMUP_QUERY: ${WIKI_SERVICE_WARMUP_QUERY:-Albert Einstein}
      WIKI_SERVICE_EMBED_MODE: ${WIKI_SERVICE_EMBED_MODE:-api}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-}
      WIKI_SERVICE_LOCAL_EMBED_MODEL: ${WIKI_SERVICE_LOCAL_EMBED_MODEL:-}
    volumes:
      - ${WIKI_SERVICE_CHROMA_HOST_DIR:-../.db/chroma}:/app/data/chroma
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          port=os.environ.get('WIKI_SERVICE_PORT', '8000');
          urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
